<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>RP</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ошибка оплаты — RiskProof</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="riskproof-shared.css">
<style>
  :root{
    --cream:#FDF7F2; --bg:#FFFAF5; --terracotta:#B05A3E; --terracotta-d:#904933;
    --chocolate:#2B1E1A; --chocolate-60:rgba(43,30,26,0.6); --chocolate-35:rgba(43,30,26,0.35);
    --chocolate-12:rgba(43,30,26,0.12); --line:rgba(43,30,26,0.14);
    --serif:'Cormorant Garamond', serif; --sans:'Inter', sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--chocolate); font-family:var(--sans); font-size:17px; font-weight:500; line-height:1.6; -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; flex-direction:column; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }
  :focus-visible{ outline:2px solid var(--terracotta); outline-offset:3px; }
  h1,h2{ font-family:var(--serif); font-weight:500; color:var(--chocolate); }
  .container{ max-width:540px; margin:0 auto; padding:0 32px; }
  header{ position:sticky; top:0; z-index:50; background:rgba(255,250,245,0.86); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .header-inner{ display:flex; align-items:center; justify-content:space-between; padding:22px 0; }
  .logo{ font-family:var(--serif); font-size:22px; font-weight:600; }
  .logo span{ color:var(--terracotta); }
  main{ flex-grow:1; display:flex; align-items:center; padding:60px 0; }
  .error-icon{ width:64px; height:64px; border-radius:50%; background:rgba(166,67,47,0.08); display:flex; align-items:center; justify-content:center; margin-bottom:32px; }
  .eyebrow{ font-size:13px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:#A6432F; margin-bottom:14px; display:block; }
  h1{ font-size:32px; line-height:1.25; margin-bottom:18px; }
  .lede{ font-size:16px; color:var(--chocolate-60); line-height:1.7; margin-bottom:36px; }
  .btn{ display:inline-flex; align-items:center; gap:10px; padding:16px 32px; border-radius:2px; font-size:14px; font-weight:600; transition:all .25s ease; }
  .btn-primary{ background:var(--terracotta); color:var(--cream); }
  .btn-primary:hover{ background:var(--terracotta-d); transform:translateY(-1px); }
  .btn-ghost{ background:transparent; color:var(--chocolate); border:1px solid var(--chocolate-12); margin-left:16px; }
  .btn-ghost:hover{ border-color:var(--terracotta); color:var(--terracotta); }
  .note{ font-size:13px; color:var(--chocolate-35); margin-top:28px; line-height:1.7; }
  @media (max-width:600px){ .container{ padding:0 22px; } }
</style>
</head>
<body>
<header><div class="header-inner"><a href="riskproof-concept.html" style="color:inherit;"><div class="logo">Risk<span>Proof</span></div></a></div></header>
<main>
<div class="container">
<div class="error-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A6432F" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg></div>
<span class="eyebrow">Ошибка оплаты</span>
<h1>Что-то пошло не так</h1>
<p class="lede">Платёж не прошёл. Это могло произойти из-за технического сбоя или отказа банка. Пожалуйста, попробуйте снова или выберите другой способ оплаты.</p>
<div>
<a class="btn btn-primary" href="javascript:history.back()">Попробовать снова</a>
<a class="btn btn-ghost" href="riskproof-concept.html">На главную</a>
</div>
<p class="note">Если ошибка повторяется — напишите в Telegram-канал, мы поможем.</p>
</div>
</main>
</body>
</html>
