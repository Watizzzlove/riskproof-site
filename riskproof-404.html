<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>RP</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена — RiskProof</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="riskproof-shared.css">
<style>
  :root{
    --cream:#FDF7F2; --bg:#FFFAF5; --terracotta:#B05A3E; --terracotta-d:#904933;
    --chocolate:#2B1E1A; --chocolate-60:rgba(43,30,26,0.6); --chocolate-35:rgba(43,30,26,0.35);
    --chocolate-12:rgba(43,30,26,0.12); --line:rgba(43,30,26,0.14);
    --serif:'Cormorant Garamond', serif; --sans:'Inter', sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--chocolate); font-family:var(--sans); font-size:17px; font-weight:500; line-height:1.6; -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  a{ color:var(--terracotta); text-decoration:underline; }
  .container{ max-width:480px; padding:0 32px; }
  .code{ font-family:var(--serif); font-size:120px; line-height:1; color:var(--chocolate-12); margin-bottom:8px; }
  h1{ font-family:var(--serif); font-size:28px; font-weight:500; color:var(--chocolate); margin-bottom:14px; }
  p{ color:var(--chocolate-60); margin-bottom:28px; font-size:16px; }
  .btn{ display:inline-flex; align-items:center; gap:10px; padding:16px 32px; border-radius:2px; font-size:14px; font-weight:600; background:var(--terracotta); color:var(--cream); text-decoration:none; transition:background .25s ease; }
  .btn:hover{ background:var(--terracotta-d); }
</style>
</head>
<body>
<div class="container">
<div class="code">404</div>
<h1>Страница не найдена</h1>
<p>Возможно, она была перемещена или удалена. Попробуйте начать с главной — там есть всё, что нужно.</p>
<a class="btn" href="riskproof-concept.html">На главную</a>
</div>
</body>
</html>
